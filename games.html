<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قسم ألعاب الكمبيوتر والتحميل - ابرزى نت</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #ffcc00;
            --accent-hover: #e6b800;
            --text-color: #ffffff;
            --text-secondary: #aaa;
            --border-color: #333333;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: var(--card-bg);
            border-bottom: 2px solid var(--accent-color);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent-color);
            text-decoration: none;
        }

        nav {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        nav a {
            color: var(--text-color);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            padding: 6px 12px;
            border-radius: 5px;
            transition: all 0.3s ease;
        }

        nav a:hover, nav a.active {
            background-color: var(--accent-color);
            color: #000;
        }

        main {
            flex: 1;
            padding: 30px 15px;
            max-width: 1000px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }

        .page-title {
            text-align: center;
            color: var(--accent-color);
            margin-bottom: 10px;
        }

        .page-subtitle {
            text-align: center;
            color: var(--text-secondary);
            margin-bottom: 25px;
            font-size: 0.95rem;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .game-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: transform 0.3s ease, border-color 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .game-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-color);
        }

        .game-image {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background-color: #222;
        }

        .game-content {
            padding: 15px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .game-title {
            color: var(--accent-color);
            margin: 0 0 10px 0;
            font-size: 1.2rem;
        }

        .game-desc {
            color: var(--text-color);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 20px;
            flex: 1;
        }

        .download-btn {
            display: block;
            background-color: var(--accent-color);
            color: #000;
            text-align: center;
            padding: 10px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.95rem;
            transition: background-color 0.3s ease;
        }

        .download-btn:hover {
            background-color: var(--accent-hover);
        }

        footer {
            background-color: var(--card-bg);
            border-top: 1px solid var(--border-color);
            text-align: center;
            padding: 15px;
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-top: auto;
        }

        footer a {
            color: var(--accent-color);
            text-decoration: none;
            margin: 0 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">⚡ Aparze.Net</a>
        <nav>
            <a href="index.html">الرئيسية</a>
            <a href="programs.html">البرامج المجانية</a>
            <a href="windows.html">أنظمة الويندوز</a>
            <a href="games.html" class="active">قسم الألعاب</a>
            <a href="paid-programs.html">البرامج المدفوعة</a>
            <a href="ads.html">عروض المحل</a>
            <a href="about.html">عن الموقع والاتصال</a>
        </nav>
    </header>

    <main>
        <h1 class="page-title">🎮 مكتبة ألعاب الكمبيوتر والتحميل</h1>
        <p class="page-subtitle">أقوى ألعاب السيبر والكمبيوتر بروابط تحميل مباشرة ومختلفة.</p>
        
        <div class="games-grid" id="gamesContainer">
            <!-- سيتم جلب الألعاب تلقائياً من games_data.json -->
        </div>
    </main>

    <footer>
        &copy; 2026 جميع الحقوق محفوظة | (Aparze Net) ابرزى نت
        <br><br>
        <a href="about.html">عن الموقع والاتصال</a> | 
        <a href="terms.html">التعليمات والشروط</a>
    </footer>

    <script>
        fetch('games_data.json')
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById('gamesContainer');
                container.innerHTML = '';
                data.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'game-card';
                    card.innerHTML = `
                        ${item.image ? `<img src="${item.image}" alt="${item.title}" class="game-image">` : ''}
                        <div class="game-content">
                            <h3 class="game-title">${item.title}</h3>
                            <p class="game-desc">${item.description}</p>
                            <a href="${item.downloader}" target="_blank" class="download-btn">تحميل اللعبة 📥</a>
                        </div>
                    `;
                    container.appendChild(card);
                });
            })
            .catch(error => console.error('خطأ في تحميل بيانات الألعاب:', error));
    </script>

    <!-- إعلانات Adsterra (إذا أردت إضافتها هنا أيضاً) -->

</body>
</html>
